[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.16"
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
glam = "0.30"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wgpu = "27"
winit = "0.30"
egui_dock = { version = "0.18.0", features = ["serde"] }
image = "0.25"
rfd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
